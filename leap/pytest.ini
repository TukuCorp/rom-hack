[pytest]
# A file handle left open is invisible until it matters, and the shared dry-run helper leaked one in
# every test that used it - 26 unraisable exceptions under `-W error`. Both filters are needed: pytest
# reports a leaked handle as PytestUnraisableExceptionWarning, not as a bare ResourceWarning.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
